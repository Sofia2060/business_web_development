[project]
name = "vinora-jewelry"
version = "0.1.0"
description = "Vinora Jewelry e-commerce website"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "pyodbc>=5.3.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
